// Lookup wire contract for LMCache mp-mode gRPC.

syntax = "proto3";

package lmcache.mp;

import "common.proto";

message LookupRequest {
  IpcCacheServerKey key = 1;
  int64 tp_size = 2;
}

message LookupResponse {}

message QueryPrefetchStatusRequest {
  string request_id = 1;
}

message QueryPrefetchStatusResponse {
  optional int64 chunk_count = 1;
}

message WaitPrefetchStatusRequest {
  string request_id = 1;
  double timeout = 2;
}

message WaitPrefetchStatusResponse {
  optional int64 chunk_count = 1;
}

// A token range left locked by an abandoned lookup; ends at its hit boundary.
message TokenRange {
  int64 start = 1;
  int64 end = 2;
}

message FreeLookupLocksRequest {
  IpcCacheServerKey key = 1;
  int64 tp_size = 2;
  repeated TokenRange extra_ranges = 3;
}

message FreeLookupLocksResponse {}

message EndSessionRequest {
  string request_id = 1;
}

message EndSessionResponse {}

message QueryKvVersionSpansRequest {
  string request_id = 1;
}

// Served tokens [start, end) and the KV version they were cached under.
message KvVersionSpan {
  int64 start = 1;
  int64 end = 2;
  int64 version = 3;
}

message KvVersionSpanList {
  repeated KvVersionSpan spans = 1;
}

message QueryKvVersionSpansResponse {
  // Unset when the server has no session for the request.
  optional KvVersionSpanList spans = 1;
}

service LookupService {
  rpc Lookup(LookupRequest) returns (LookupResponse);
  rpc QueryPrefetchStatus(QueryPrefetchStatusRequest)
      returns (QueryPrefetchStatusResponse);
  rpc WaitPrefetchStatus(WaitPrefetchStatusRequest)
      returns (WaitPrefetchStatusResponse);
  rpc FreeLookupLocks(FreeLookupLocksRequest) returns (FreeLookupLocksResponse);
  rpc EndSession(EndSessionRequest) returns (EndSessionResponse);
  rpc QueryKvVersionSpans(QueryKvVersionSpansRequest)
      returns (QueryKvVersionSpansResponse);
}
